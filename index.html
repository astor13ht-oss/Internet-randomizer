        const boton = document.getElementById("randomButton");
        const resultado = document.getElementById("result");
        const languageButton = document.getElementById("languageButton");
        const titulo = document.getElementById("titulo");


        boton.addEventListener("click", function() {

            const numero = Math.floor(Math.random() * cosas.length);

            const cosa = cosas[numero];

            const texto = ingles ? cosa.en : cosa.es;


            if (cosa.tipo === "texto") {

                resultado.textContent = texto;

            }


            if (cosa.tipo === "enlace") {

                resultado.innerHTML =
                    `<a href="${cosa.url}" target="_blank" rel="noopener noreferrer">${texto}</a>`;

            }

        });


        /* =========================
           CAMBIAR IDIOMA
           ========================= */

        languageButton.addEventListener("click", function() {

            ingles = !ingles;

            if (ingles) {

                titulo.textContent = "🌐 Internet Randomizer";

                boton.textContent = "🎲 SURPRISE ME";

                languageButton.textContent = "🇪🇸 Español";

            } else {

                titulo.textContent = "🌐 Internet Randomizer";

                boton.textContent = "🎲 SORPRÉNDEME";

                languageButton.textContent = "🇬🇧 English";
